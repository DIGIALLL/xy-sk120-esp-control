# XY-SK120 (old board, also works with SK120X) remote control over WiFi.
# ESPHome firmware for ESP32-C3 SuperMini talking Modbus-RTU to the module's TTL UART.
#
# Register map follows community libraries (xy-modbus, csvke/XY-SK120-Modbus-RTU-TTL,
# donkilove/Sk150PowerSupplySDK). Verified on an XY-SK120 (old board) with firmware 139:
# 115200 8N1, slave address 1. Check current/power scaling against the module's screen.

substitutions:
  name: xy-sk120
  friendly_name: "XY-SK120"
  modbus_addr: "1"        # module menu: Add
  baud: "115200"          # module menu: bRE (default 115200)
  i_scale: "0.001"        # current is raw/1000; verify against the screen under load
  p_scale: "0.01"         # power is raw/100; verify against the screen

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
api:
  encryption:
    key: !secret xy_api_key
ota:
  - platform: esphome
    password: !secret xy_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 8.5dB     # fixes "Auth Expired" on C3 SuperMini boards
  ap:
    ssid: "xy-sk120-fallback"
    password: !secret ap_password

web_server:
  port: 80

uart:
  id: uart_sk
  tx_pin: GPIO21          # -> module RX
  rx_pin: GPIO20          # <- module TX
  baud_rate: ${baud}
  stop_bits: 1

modbus:
  id: modbus1
  uart_id: uart_sk
  send_wait_time: 100ms

modbus_controller:
  - id: sk
    modbus_id: modbus1
    address: ${modbus_addr}
    update_interval: 300ms
    command_throttle: 50ms
    setup_priority: -10

sensor:
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "Output Voltage"
    id: u_out
    address: 0x0002
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: voltage
    filters:
      - multiply: 0.01
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "Output Current"
    id: i_out
    address: 0x0003
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 3
    device_class: current
    filters:
      - multiply: ${i_scale}
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "Output Power"
    id: p_out
    address: 0x0004
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "W"
    accuracy_decimals: 2
    device_class: power
    filters:
      - multiply: ${p_scale}
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "Input Voltage"
    id: u_in
    address: 0x0005
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: voltage
    filters:
      - multiply: 0.01
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "Temperature"
    id: temp
    address: 0x000D
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    filters:
      - multiply: 0.1
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "Energy Wh"
    id: wh
    address: 0x0008
    register_type: holding
    value_type: U_DWORD_R        # low word first (0x0008 low, 0x0009 high)
    unit_of_measurement: "Wh"
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "Charge Ah"
    id: ah
    address: 0x0006
    register_type: holding
    value_type: U_DWORD_R
    unit_of_measurement: "Ah"
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "Temp ext"
    id: temp_ext
    address: 0x000E
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    filters:
      - lambda: 'return (x >= 8000) ? NAN : x * 0.1;'
  # --- Protection thresholds of memory group M0 (raw values, registers 0x0050 + offset) ---
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "M0 LVP"
    address: 0x0052
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "M0 OVP"
    address: 0x0053
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "M0 OHP_H"
    address: 0x0056
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "M0 OHP_M"
    address: 0x0057
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "M0 OAH_L"
    address: 0x0058
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "M0 OAH_H"
    address: 0x0059
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "M0 OWH_L"
    address: 0x005A
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "M0 OWH_H"
    address: 0x005B
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "M0 INI"
    address: 0x005D
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic
  # Diagnostics - compare with UER in the module menu
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "Model code"
    id: model
    address: 0x0016
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "FW version"
    id: fw_version
    address: 0x0017
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "Protection code"
    id: protect
    address: 0x0010
    register_type: holding
    value_type: U_WORD
    entity_category: diagnostic

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "CC Mode"
    id: mode_cc
    address: 0x0011        # 0=CV, 1=CC
    register_type: holding
    bitmask: 1
  # Physical output button: GPIO3 to GND (internal pull-up)
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    name: "Output Button"
    id: btn_out
    filters:
      - delayed_on: 30ms
    on_press:
      - switch.toggle: out_sw

# ===================== write access =====================
switch:
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "Output"
    id: out_sw
    address: 0x0012
    register_type: holding
    bitmask: 1
    use_write_multiple: false      # Modbus function 0x06

number:
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "Set Voltage"
    id: set_u
    address: 0x0000
    register_type: holding
    value_type: U_WORD
    min_value: 0
    max_value: 36
    step: 0.01
    multiply: 100
    unit_of_measurement: "V"
    use_write_multiple: false
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "Set Current"
    id: set_i
    address: 0x0001
    register_type: holding
    value_type: U_WORD
    min_value: 0
    max_value: 6
    step: 0.01
    multiply: 1000                 # current setpoint is raw/1000 (same as i_scale)
    unit_of_measurement: "A"
    use_write_multiple: false
  # Hardware protection thresholds of the module (group M0). The app adjusts them to the setpoints.
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "M0 OCP"
    id: m0_ocp
    address: 0x0054
    register_type: holding
    value_type: U_WORD
    min_value: 0.1
    max_value: 6.2
    step: 0.001
    multiply: 1000
    unit_of_measurement: "A"
    use_write_multiple: false
    entity_category: config
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "M0 OPP"
    id: m0_opp
    address: 0x0055
    register_type: holding
    value_type: U_WORD
    min_value: 1
    max_value: 125
    step: 0.1
    multiply: 10
    unit_of_measurement: "W"
    use_write_multiple: false
    entity_category: config
  - platform: modbus_controller
    modbus_controller_id: sk
    name: "M0 OTP"
    id: m0_otp
    address: 0x005C
    register_type: holding
    value_type: U_WORD
    min_value: 40
    max_value: 95
    step: 1
    multiply: 1
    unit_of_measurement: "°C"
    use_write_multiple: false
    entity_category: config
